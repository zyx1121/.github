# Reusable, for a repo's ci, after every other job: makes the images that
# image.yml pushed as candidate-<tree> into tree-<tree>, the only tag
# ship.yml deploys. Call it with needs: on all of the repo's checks.
name: promote

on:
  workflow_call:
    inputs:
      images:
        description: JSON array of image names, or of {"name"} objects as given to image.yml
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  promote:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          for name in $(jq -r '.[] | if type == "string" then . else .name end' <<<"$IMAGES"); do
            docker buildx imagetools create -t "$name:tree-$tree" "$name:candidate-$tree"
          done
